name: "🛒 Website V2 CI/CD"
run-name: "🛒 Website V2 — ${{ github.event_name == 'workflow_dispatch' && 'Manual deploy' || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/akttools-chaitanya/akt-website-v2
  DEPLOY_DIR: /opt/akt-website-v2

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are inlined at build time. Staging values: not indexable, staging origin.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://v2.mrtechnobaba.co.in' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-W7P4G5S' }}
            NEXT_PUBLIC_INDEXABLE=${{ vars.NEXT_PUBLIC_INDEXABLE || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy to KVM8 (staging)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /opt/akt-website-v2

            echo "Logging into GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Pulling latest web image..."
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.yml -f docker-compose.prod.yml pull web; then
                break
              fi
              echo "Pull attempt $attempt failed; retrying in 10s..."
              sleep 10
              [ "$attempt" = 3 ] && { echo "web image pull failed after 3 attempts"; exit 1; }
            done

            echo "Starting stack (meilisearch + web)..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate web

            echo "Rebuilding the Meili index from live catalog..."
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web node scripts/reindex.mjs || echo "reindex will retry via cron"

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Website V2 deployed ✅"
