# Production/staging override — pulls the pre-built image from GHCR instead of building.
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    image: ghcr.io/akttools-chaitanya/akt-website-v2:latest
    build: !reset null   # disable source build — use the registry image
